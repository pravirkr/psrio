minimum_pre_commit_version: "3.5.0"

exclude: ^(build[^/]*|tmp_files|\.cache|\.venv)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # .clang-format uses multiple YAML documents (global + Language: Cpp).
        exclude: ^\.clang-format$
      - id: check-added-large-files
        # sigpyproc3 filterbanks in tests/data are larger than the 500 KB default.
        exclude: ^tests/data/
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        files: ^(include|tests|applications)/

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]
        args: [--config-files=.cmake-format.yaml]
        exclude: cmake/CPM\.cmake$
      - id: cmake-lint
        additional_dependencies: [pyyaml]
        args: [--config-files=.cmake-format.yaml]
        exclude: cmake/(CPM|FindFFTW)\.cmake$

  # Layout, include and namespace rules from AGENTS.md. The
  # standalone-header compile runs in CI; locally it is skipped for speed.
  - repo: local
    hooks:
      - id: check-architecture
        name: architecture rules (AGENTS.md)
        entry: env SKIP_COMPILE=1 scripts/check_architecture.sh
        language: system
        pass_filenames: false
        files: ^(include|tests|applications)/
