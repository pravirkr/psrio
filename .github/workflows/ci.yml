name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: "C++ tests (${{ matrix.compiler.cc }})"
    runs-on: ${{ matrix.compiler.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          # Floor: GCC 11 and Clang 15 share Ubuntu 22.04's libstdc++, which has no std::format.
          # Ubuntu 22.04's apt catch2 is v2, so those jobs omit it and FetchContent pins Catch2 v3.
          # dmt requires Clang >= 17, so clang-15 tests the header-only library floor with PSRIO_BUILD_APPLICATIONS=OFF.
          - { cc: gcc-11, cpp: g++-11, pkgs: "gcc-11 g++-11", extra: "python3-dev libhdf5-dev libfftw3-dev git", apps: "ON", os: ubuntu-22.04 }
          - { cc: clang-15, cpp: clang++-15, pkgs: "clang-15 libomp-15-dev", extra: "python3-dev libhdf5-dev git", apps: "OFF", os: ubuntu-22.04 }
          - { cc: gcc-13, cpp: g++-13, pkgs: "gcc-13 g++-13", extra: "python3-dev libhdf5-dev libfftw3-dev catch2 git", apps: "ON", os: ubuntu-24.04 }
          - { cc: clang-18, cpp: clang++-18, pkgs: "clang-18 libomp-18-dev", extra: "python3-dev libhdf5-dev libfftw3-dev catch2 git", apps: "ON", os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            ${{ matrix.compiler.pkgs }} \
            ${{ matrix.compiler.extra }}

      - name: Cache ccache object store
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-tests-${{ matrix.compiler.cc }}
          max-size: 500M

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cpp }}
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_BUILD_TYPE=Release
          -DPSRIO_BUILD_TESTS=ON
          -DPSRIO_BUILD_APPLICATIONS=${{ matrix.compiler.apps }}
          -DPSRIO_WITH_HDF5=ON
          -DPSRIO_WITH_PSRDADA=ON
          -DPSRIO_ENABLE_COVERAGE=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Architecture and standalone header checks
        env:
          CXX: ${{ matrix.compiler.cpp }}
          REQUIRE_OPTIONAL_HEADERS: "1"
        run: scripts/check_architecture.sh

      - name: Run C++ unit tests
        run: ctest --test-dir build/tests/ --output-on-failure

  clang-tidy:
    name: Lint & static analysis (LLVM 23)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLVM_VERSION: "23"
      BUILD_DIR: build-ci-tidy
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages and LLVM 23
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git wget lsb-release \
            gnupg software-properties-common python3-dev python3-pip \
            libhdf5-dev libfftw3-dev catch2
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "${LLVM_VERSION}"
          sudo apt install -y --no-install-recommends \
            "clang-${LLVM_VERSION}" \
            "clang-tidy-${LLVM_VERSION}" \
            "clang-format-${LLVM_VERSION}" \
            "libomp-${LLVM_VERSION}-dev"
          "clang-tidy-${LLVM_VERSION}" --version

      - name: Install pre-commit
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages \
            pre-commit==4.2.0

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Warm pre-commit hook environments
        run: pre-commit install-hooks

      - name: Configure CMake
        env:
          CC: clang-23
          CXX: clang++-23
        run: >
          cmake -B "${BUILD_DIR}" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DPSRIO_BUILD_TESTS=ON
          -DPSRIO_BUILD_APPLICATIONS=ON
          -DPSRIO_WITH_HDF5=ON
          -DPSRIO_WITH_PSRDADA=ON
          -DPSRIO_ENABLE_COVERAGE=OFF

      - name: Build and static analysis
        run: scripts/ci_lint_job.sh

  install-consumer:
    name: Installed package finds fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential cmake ninja-build g++ git ca-certificates curl

      - name: Install fmt 12.1.0 and psrio, then build a consumer
        run: |
          set -euo pipefail
          prefix="$PWD/prefix"
          src="$PWD/build/fmt-src"
          mkdir -p "$src"
          curl -fsSL -o "$PWD/build/fmt-12.1.0.tar.gz" \
            https://github.com/fmtlib/fmt/archive/refs/tags/12.1.0.tar.gz
          echo "ea7de4299689e12b6dddd392f9896f08fb0777ac7168897a244a6d6085043fea  $PWD/build/fmt-12.1.0.tar.gz" \
            | sha256sum -c
          tar -xzf "$PWD/build/fmt-12.1.0.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$PWD/build/fmt" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF
          cmake --build "$PWD/build/fmt"
          cmake --install "$PWD/build/fmt"

          cmake -S "$PWD" -B "$PWD/build/psrio" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSRIO_BUILD_TESTS=OFF \
            -DPSRIO_BUILD_APPLICATIONS=OFF \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --install "$PWD/build/psrio"

          mkdir -p "$PWD/build/consumer"
          cat > "$PWD/build/consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(psrio_consumer LANGUAGES CXX)
          find_package(psrio CONFIG REQUIRED)
          add_executable(useit use.cpp)
          target_link_libraries(useit PRIVATE psrio::psrio)
          EOF
          cat > "$PWD/build/consumer/use.cpp" <<'EOF'
          #include <psrio/psrio.hpp>
          int main() { return psrio::version().empty() ? 1 : 0; }
          EOF
          cmake -S "$PWD/build/consumer" -B "$PWD/build/consumer/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$PWD/build/consumer/build"
          "$PWD/build/consumer/build/useit"
